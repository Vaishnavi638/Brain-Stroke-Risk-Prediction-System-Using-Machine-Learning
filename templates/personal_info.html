<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Information</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body style="background-color: #9dcaf7;">
<div class="container my-5">
    <div class="card p-4 shadow-lg">
        <h3 class="text-center mb-4 text-primary">Personal Information</h3>
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label>Full Name</label>
                    <input type="text" name="full_name" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label>Age</label>
                    <input type="number" name="age" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label>Gender</label>
                    <select name="gender" class="form-select" required>
                        <option value="" disabled selected>Select</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label>Address</label>
                    <input type="text" name="address" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label>Mobile No</label>
                    <input type="tel" name="mobile" pattern="[0-9]{10}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label>Smoking Status</label>
                    <select name="smoking_status" class="form-select" required>
                        <option>Never Smoked</option>
                        <option>Formerly Smoked</option>
                        <option>Smokes</option>
                        <option>Unknown</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label>Work Type</label>
                    <select name="work_type" class="form-select" required>
                        <option>Private</option>
                        <option>Self-employed</option>
                        <option>Government job</option>
                        <option>Children</option>
                        <option>Never Worked</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label>Ever Married</label>
                    <select name="ever_married" class="form-select" required>
                        <option>Yes</option>
                        <option>No</option>
                    </select>
                </div>
            </div>
            <div class="text-center mt-4">
                <button class="btn btn-primary btn-lg">Save and Next</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
