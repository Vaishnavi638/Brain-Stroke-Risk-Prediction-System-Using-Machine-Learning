<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stroke Prediction</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            box-shadow: 0 4px 8px rgba(13, 14, 13, 0.05);
            border: none;
            border-radius: 10px;
        }

        .form-section {
            margin-bottom: 30px;
        }

        h4.section-title {
            margin-bottom: 20px;
            border-bottom: 2px solid #1e58ecff;
            padding-bottom: 5px;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
            font-weight: 500;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }
    
        body {
            background: url("https://as1.ftcdn.net/jpg/07/86/34/68/1000_F_786346890_E4BqkCpTHWZg4LIcBnqG2MdyB1Afxz1z.webp") no-repeat center center fixed;
            background-size: cover;
            }
        

    </style>
</head>
<body>
    <div class="container my-5">
        <h2 class="text-center mb-4" style='color:#FFD700'>Stroke Prediction using Machine Learning</h2>

        <form method="POST">
            <div class="card p-4 form-section">
                <h4 class="section-title" style='color:#3324c2ff'>Personal Information</h4>
                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="number" class="form-control" name="age" id="age" min="1" max="100" required>
                            <label for="age">Age</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <select class="form-select" name="gender" id="gender" required>
                                <option value="" disabled selected>Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                            <label for="gender">Gender</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card p-4 form-section">
                <h4 class="section-title" style='color:#3324c2ff'>Medical Information</h4>
                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="number" step="0.01" class="form-control" name="avg_glucose_level" id="avg_glucose_level" min="40.0" max="300.0" required>
                            <label for="avg_glucose_level">Average Glucose Level</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="number" class="form-control" name="bmi" id="bmi" min="10" max="100" required>
                            <label for="bmi">BMI</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <select class="form-select" name="hypertension" id="hypertension" required>
                                <option value="0">No</option>
                                <option value="1">Yes</option>
                            </select>
                            <label for="hypertension">Hypertension</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <select class="form-select" name="heart_disease" id="heart_disease" required>
                                <option value="0">No</option>
                                <option value="1">Yes</option>
                            </select>
                            <label for="heart_disease">Heart Disease</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card p-4 form-section">
                <h4 class="section-title" style='color:#3324c2ff'>Lifestyle & Other Factors</h4>
                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <select class="form-select" name="ever_married" id="ever_married" required>
                                <option value="Yes">Yes</option>
                                <option value="No">No</option>
                            </select>
                            <label for="ever_married">Ever Married</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <select class="form-select" name="residence_type" id="residence_type" required>
                                <option value="Urban">Urban</option>
                                <option value="Rural">Rural</option>
                            </select>
                            <label for="residence_type">Residence Type</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <select class="form-select" name="smoking_status" id="smoking_status" required>
                                <option value="Never Smoked">Never Smoked</option>
                                <option value="Formerly Smoked">Formerly Smoked</option>
                                <option value="Smokes">Smokes</option>
                                <option value="Unknown">Unknown</option>
                            </select>
                            <label for="smoking_status">Smoking Status</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <select class="form-select" name="work_type" id="work_type" required>
                                <option value="Private">Private</option>
                                <option value="Self-employed">Self-employed</option>
                                <option value="Government job">Government job</option>
                                <option value="Children">Children</option>
                                <option value="Never Worked">Never Worked</option>
                            </select>
                            <label for="work_type">Work Type</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary btn-lg mt-3 w-50">Predict Stroke Likelihood</button>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
