<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medical Information</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
        function calculateValues() {
            let bp = parseFloat(document.getElementById("bp").value);
            if (!isNaN(bp)) {
                document.getElementById("hypertension").value = (bp >= 140) ? "Yes" : "No";
            }

            let height = parseFloat(document.getElementById("height").value);
            let weight = parseFloat(document.getElementById("weight").value);
            if (!isNaN(height) && !isNaN(weight) && height > 0) {
                let bmi = weight / Math.pow(height / 100, 2);
                document.getElementById("bmi").value = bmi.toFixed(2);
            }
        }
    </script>
    
</head>
<body style="background-color: #9dcaf7;">
<div class="container my-5">
    <div class="card p-4 shadow-lg">
        <h3 class="text-center mb-4 text-success">Medical Information</h3>
        <form method="POST" oninput="calculateValues()">
            <div class="row g-3">
                <div class="col-md-6">
                    <label>Blood Pressure (BP)</label>
                    <input type="number" id="bp" name="bp" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label>Hypertension</label>
                    <input type="text" id="hypertension" name="hypertension" class="form-control" readonly>
                </div>
                <div class="col-md-4">
                    <label>Height (cm)</label>
                    <input type="number" id="height" name="height" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label>Weight (kg)</label>
                    <input type="number" id="weight" name="weight" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label>BMI</label>
                    <input type="text" id="bmi" name="bmi" class="form-control" readonly>
                </div>
                <div class="col-md-6">
                    <label>Average Glucose Level</label>
                    <input type="number" name="avg_glucose_level" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label>Heart Disease</label>
                    <select name="heart_disease" class="form-select" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label>Residence Type</label>
                    <select name="residence_type" class="form-select" required>
                        <option>Urban</option>
                        <option>Rural</option>
                    </select>
                </div>
            </div>

            <div class="text-center mt-4">
                <button class="btn btn-success btn-lg">Predict Stroke</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
